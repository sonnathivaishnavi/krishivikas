<style>
body {
margin: 0;
padding: 0;

.container {
max-width: 1000px;
margin: 0 auto;
padding: 30px;
}

h1 {
text-align: center;
margin-bottom: 30px;
color: #2e7d32;
}

margin: 0 auto 20px auto;

background-color: #43a047;
color: white;

#pesticideList {

margin-top: 30px;

.pesticide {

border-radius: 10px;
padding: 20px;
margin-bottom: 20px;

align-items: center;

.pesticide img {
width: 100px;
height: 100px;
object-fit: cover;
margin-right: 20px;
border-radius: 8px;
border: 2px solid #ccc;
}

.pesticide-info {
flex: 1;
}

.pesticide-info strong {
color: #1b5e20;
}
</style>

function showPesticides() {
const list = document.getElementById("pesticideList");
list.innerHTML = ""; // Clear content in case button clicked again

pesticides.forEach(p => {
const card = document.createElement("div");
card.className = "pesticide";
card.innerHTML = `
<img src="${p.img}" alt="${p.name}">
<div class="pesticide-info">
<strong>Name:</strong> ${p.name}<br>
<strong>Used for:</strong> ${p.crop}
</div>
`;
list.appendChild(card);
});

list.style.display = "block";
}
</script>
