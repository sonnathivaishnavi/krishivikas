<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agriculture Solutions - KrishiVikas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f0fdf4; }
    .glass {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-screen text-green-900">

<!-- Top Bar -->
<div class="glass p-4 flex flex-col md:flex-row gap-4 items-center justify-between shadow-md sticky top-0 z-50">
  <select id="languageSelect" class="p-2 rounded-lg bg-white bg-opacity-80 focus:outline-none focus:ring-2 focus:ring-green-400">
    <option value="English">🇬🇧 English</option>
    <option value="Hindi">🇮🇳 हिंदी (Hindi)</option>
    <option value="Telugu">🇮🇳 తెలుగు (Telugu)</option>
    <option value="Tamil">🇮🇳 தமிழ் (Tamil)</option>
    <option value="Kannada">🇮🇳 ಕನ್ನಡ (Kannada)</option>
    <option value="Marathi">🇮🇳 मराठी (Marathi)</option>
  </select>

  <div class="flex w-full md:w-auto flex-grow items-center bg-white bg-opacity-70 rounded-lg overflow-hidden shadow-sm">
    <input type="text" id="searchInput" placeholder="Ask any agriculture question..." class="flex-grow px-4 py-2 Вінструкція focus:outline-none" />
    <button onclick="searchQuestion()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 transition duration-300">Search</button>
  </div>

  <button onclick="startVoiceRecognition()" class="flex items-center gap-2 text-green-800 hover:text-green-900 font-semibold mt-2 md:mt-0">
    🎤 Voice
  </button>
</div>

<!-- Content -->
<div class="p-6 max-w-3xl mx-auto text-center">
  <h1 class="text-4xl font-bold mb-6">KRISHIVIKAS</h1>
  <p class="text-lg mb-4">A seed is a whisper to the future, and the farmer is the one who listens.</p>
  <p id="voiceStatus" class="text-sm text-gray-600 mt-2"></p>

  <!-- Result -->
  <div id="result" class="mt-6 text-md text-gray-800 border border-gray-300 rounded-lg bg-white bg-opacity-70 p-6 shadow-md min-h-[150px]">
    🪴 Ask anything about agriculture or farming!
  </div>
</div>

<script>
  async function searchQuestion() {
    const input = document.getElementById("searchInput").value.trim();
    const resultDiv = document.getElementById("result");

    if (!input) {
      resultDiv.innerHTML = "❗ Please enter your question.";
      return;
    }

    resultDiv.innerHTML = "⏳ Thinking... please wait...";

    try {
      const response = await fetch('http://127.0.0.1:5000/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: input })
      });

      const data = await response.json();

      if (data.answer) {
        resultDiv.innerHTML = `<strong>Answer:</strong><br><br>${data.answer.replace(/\n/g, "<br>")}`;
      } else {
        resultDiv.innerHTML = "❌ Error getting response.";
      }
    } catch (error) {
      console.error(error);
      resultDiv.innerHTML = "❌ Error connecting to server.";
    }
  }

  // Add Enter key listener to the search input
  document.getElementById("searchInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      searchQuestion();
    }
  });
</script>

</body>
</html>
